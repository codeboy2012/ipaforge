<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img"
     aria-labelledby="ttl dsc" font-family="Inter, -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title id="ttl">IPAForge icon directions — concept board</title>
  <desc id="dsc">Concept artwork only. Three original icon directions shown at 192 px, with rationale and 32, 24 and 16 pixel legibility tests. Not a released icon and not affiliated with Apple or any upstream project.</desc>
  <defs>
    <linearGradient id="s-a-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2431"/><stop offset="1" stop-color="#07090D"/>
    </linearGradient>
    <linearGradient id="s-a-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8C182"/><stop offset="1" stop-color="#DE8638"/>
    </linearGradient>
    <radialGradient id="s-a-glow" cx="0.68" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#F0A14B" stop-opacity="0.38"/><stop offset="1" stop-color="#F0A14B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="s-b-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182029"/><stop offset="1" stop-color="#07090D"/>
    </linearGradient>
    <linearGradient id="s-c-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16202A"/><stop offset="1" stop-color="#06090C"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="780" fill="#0B0E13"/>
  <text x="64" y="86" font-size="28" font-weight="700" fill="#EDF3F9">Icon directions</text>
  <text x="64" y="114" font-size="12.5" fill="#8394A7">Three original concepts, drawn as geometry. Concept artwork only — no released icon, not affiliated with Apple or any upstream project.</text>

  <!-- Direction A -->
  <g>
    <rect x="64" y="150" width="408" height="560" rx="16" fill="#101720" stroke="#222D3A"/>
    <g transform="translate(172,180) scale(0.375)">
      <rect width="512" height="512" rx="116" fill="url(#s-a-bg)"/>
      <rect width="512" height="512" rx="116" fill="url(#s-a-glow)"/>
      <rect x="128" y="306" width="240" height="62" rx="20" fill="#4C2E1B"/>
      <rect x="140" y="256" width="240" height="62" rx="20" fill="#8A5022"/>
      <rect x="152" y="206" width="240" height="62" rx="20" fill="url(#s-a-plate)"/>
      <rect x="152" y="206" width="240" height="16" rx="8" fill="#FFE6C4" opacity="0.3"/>
      <path d="M362 128 L369 150 L391 157 L369 164 L362 186 L355 164 L333 157 L355 150 Z" fill="#FFD9A0"/>
      <circle cx="406" cy="190" r="4" fill="#FFD9A0" opacity="0.6"/>
      <circle cx="318" cy="160" r="3" fill="#FFD9A0" opacity="0.45"/>
    </g>
    <text x="88" y="404" font-size="10" letter-spacing="2.2" fill="#6C7D90">DIRECTION A</text>
    <text x="88" y="432" font-size="17" font-weight="600" fill="#E4ECF4">Stack &amp; Spark</text>
    <text x="88" y="460" font-size="11.5" fill="#7E8FA2">Layered plates for bundle layers, plus a forge</text>
    <text x="88" y="480" font-size="11.5" fill="#7E8FA2">spark. Flattest and most readable at small sizes;</text>
    <text x="88" y="500" font-size="11.5" fill="#7E8FA2">the safest production candidate.</text>
    <text x="88" y="542" font-size="9.5" letter-spacing="1.8" fill="#5F7084">AT 32 / 24 / 16 PX</text>
    <g transform="translate(88,554) scale(0.0625)">
      <rect width="512" height="512" rx="116" fill="url(#s-a-bg)"/>
      <rect x="152" y="206" width="240" height="62" rx="20" fill="url(#s-a-plate)"/>
      <rect x="140" y="256" width="240" height="62" rx="20" fill="#8A5022"/>
      <rect x="128" y="306" width="240" height="62" rx="20" fill="#4C2E1B"/>
      <path d="M362 128 L369 150 L391 157 L369 164 L362 186 L355 164 L333 157 L355 150 Z" fill="#FFD9A0"/>
    </g>
    <g transform="translate(130,562) scale(0.046875)">
      <rect width="512" height="512" rx="116" fill="url(#s-a-bg)"/>
      <rect x="152" y="206" width="240" height="62" rx="20" fill="url(#s-a-plate)"/>
      <rect x="140" y="256" width="240" height="62" rx="20" fill="#8A5022"/>
      <rect x="128" y="306" width="240" height="62" rx="20" fill="#4C2E1B"/>
    </g>
    <g transform="translate(164,570) scale(0.03125)">
      <rect width="512" height="512" rx="116" fill="url(#s-a-bg)"/>
      <rect x="152" y="206" width="240" height="62" rx="20" fill="url(#s-a-plate)"/>
      <rect x="140" y="256" width="240" height="62" rx="20" fill="#8A5022"/>
      <rect x="128" y="306" width="240" height="62" rx="20" fill="#4C2E1B"/>
    </g>
    <text x="88" y="640" font-size="10.5" fill="#5F7084">Legibility test: the spark and plate edges must</text>
    <text x="88" y="657" font-size="10.5" fill="#5F7084">survive a 16 px toolbar slot.</text>
  </g>

  <!-- Direction B -->
  <g>
    <rect x="496" y="150" width="408" height="560" rx="16" fill="#101720" stroke="#222D3A"/>
    <g transform="translate(604,180) scale(0.375)">
      <rect width="512" height="512" rx="116" fill="url(#s-b-bg)"/>
      <g transform="translate(0,12)" fill="#6B3E1D" opacity="0.6">
        <rect x="140" y="146" width="56" height="216" rx="18"/>
        <rect x="242" y="146" width="56" height="216" rx="18"/>
        <rect x="242" y="146" width="126" height="56" rx="18"/>
        <rect x="242" y="226" width="94" height="56" rx="18"/>
      </g>
      <g fill="url(#s-a-plate)">
        <rect x="140" y="146" width="56" height="216" rx="18"/>
        <rect x="242" y="146" width="56" height="216" rx="18"/>
        <rect x="242" y="146" width="126" height="56" rx="18"/>
        <rect x="242" y="226" width="94" height="56" rx="18"/>
      </g>
      <circle cx="378" cy="378" r="9" fill="#5AD1C4"/>
    </g>
    <text x="520" y="404" font-size="10" letter-spacing="2.2" fill="#6C7D90">DIRECTION B</text>
    <text x="520" y="432" font-size="17" font-weight="600" fill="#E4ECF4">Layered Monogram</text>
    <text x="520" y="460" font-size="11.5" fill="#7E8FA2">A geometric I and F cut as two plates. Best</text>
    <text x="520" y="480" font-size="11.5" fill="#7E8FA2">pairing with a wordmark; slightly denser at</text>
    <text x="520" y="500" font-size="11.5" fill="#7E8FA2">16 px, where the arms can merge.</text>
    <text x="520" y="542" font-size="9.5" letter-spacing="1.8" fill="#5F7084">AT 32 / 24 / 16 PX</text>
    <g transform="translate(520,554) scale(0.0625)">
      <rect width="512" height="512" rx="116" fill="url(#s-b-bg)"/>
      <g fill="url(#s-a-plate)">
        <rect x="140" y="146" width="56" height="216" rx="18"/>
        <rect x="242" y="146" width="56" height="216" rx="18"/>
        <rect x="242" y="146" width="126" height="56" rx="18"/>
        <rect x="242" y="226" width="94" height="56" rx="18"/>
      </g>
    </g>
    <g transform="translate(562,562) scale(0.046875)">
      <rect width="512" height="512" rx="116" fill="url(#s-b-bg)"/>
      <g fill="url(#s-a-plate)">
        <rect x="140" y="146" width="56" height="216" rx="18"/>
        <rect x="242" y="146" width="56" height="216" rx="18"/>
        <rect x="242" y="146" width="126" height="56" rx="18"/>
        <rect x="242" y="226" width="94" height="56" rx="18"/>
      </g>
    </g>
    <g transform="translate(596,570) scale(0.03125)">
      <rect width="512" height="512" rx="116" fill="url(#s-b-bg)"/>
      <g fill="url(#s-a-plate)">
        <rect x="140" y="146" width="56" height="216" rx="18"/>
        <rect x="242" y="146" width="56" height="216" rx="18"/>
        <rect x="242" y="146" width="126" height="56" rx="18"/>
        <rect x="242" y="226" width="94" height="56" rx="18"/>
      </g>
    </g>
    <text x="520" y="640" font-size="10.5" fill="#5F7084">Legibility test: the gap between the arms is the</text>
    <text x="520" y="657" font-size="10.5" fill="#5F7084">first thing lost.</text>
  </g>

  <!-- Direction C -->
  <g>
    <rect x="928" y="150" width="408" height="560" rx="16" fill="#101720" stroke="#222D3A"/>
    <g transform="translate(1036,180) scale(0.375)">
      <rect width="512" height="512" rx="116" fill="url(#s-c-bg)"/>
      <path d="M256 84 L406 138 L406 268 C406 356 340 412 256 434 C172 412 106 356 106 268 L106 138 Z"
            fill="#121B24" stroke="#5AD1C4" stroke-width="12" stroke-linejoin="round" stroke-opacity="0.9"/>
      <path d="M196 258 L238 302 L320 208" fill="none" stroke="url(#s-a-plate)" stroke-width="24"
            stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="196" y1="356" x2="316" y2="356" stroke="#5AD1C4" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
    </g>
    <text x="952" y="404" font-size="10" letter-spacing="2.2" fill="#6C7D90">DIRECTION C</text>
    <text x="952" y="432" font-size="17" font-weight="600" fill="#E4ECF4">Keystone Shield</text>
    <text x="952" y="460" font-size="11.5" fill="#7E8FA2">A shield around a bundle plate — trust and</text>
    <text x="952" y="480" font-size="11.5" fill="#7E8FA2">signing made explicit. Most literal, least</text>
    <text x="952" y="500" font-size="11.5" fill="#7E8FA2">distinctive; suits a verification sub-brand</text>
    <text x="952" y="520" font-size="11.5" fill="#7E8FA2">more than the app icon itself.</text>
    <text x="952" y="542" font-size="9.5" letter-spacing="1.8" fill="#5F7084">AT 32 / 24 / 16 PX</text>
    <g transform="translate(952,554) scale(0.0625)">
      <rect width="512" height="512" rx="116" fill="url(#s-c-bg)"/>
      <path d="M256 84 L406 138 L406 268 C406 356 340 412 256 434 C172 412 106 356 106 268 L106 138 Z"
            fill="#121B24" stroke="#5AD1C4" stroke-width="14" stroke-linejoin="round"/>
      <path d="M196 258 L238 302 L320 208" fill="none" stroke="url(#s-a-plate)" stroke-width="30"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(994,562) scale(0.046875)">
      <rect width="512" height="512" rx="116" fill="url(#s-c-bg)"/>
      <path d="M256 84 L406 138 L406 268 C406 356 340 412 256 434 C172 412 106 356 106 268 L106 138 Z"
            fill="#121B24" stroke="#5AD1C4" stroke-width="20" stroke-linejoin="round"/>
      <path d="M196 258 L238 302 L320 208" fill="none" stroke="url(#s-a-plate)" stroke-width="36"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(1028,570) scale(0.03125)">
      <rect width="512" height="512" rx="116" fill="url(#s-c-bg)"/>
      <path d="M256 84 L406 138 L406 268 C406 356 340 412 256 434 C172 412 106 356 106 268 L106 138 Z"
            fill="#121B24" stroke="#5AD1C4" stroke-width="24" stroke-linejoin="round"/>
      <path d="M196 258 L238 302 L320 208" fill="none" stroke="url(#s-a-plate)" stroke-width="40"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="952" y="640" font-size="10.5" fill="#5F7084">Legibility test: the check must stay a check,</text>
    <text x="952" y="657" font-size="10.5" fill="#5F7084">not a wedge.</text>
  </g>

  <text x="64" y="750" font-size="10.5" fill="#4F6074">Concept board · authored geometry, no third-party icon assets · none of these directions is selected or shipped.</text>
</svg>
