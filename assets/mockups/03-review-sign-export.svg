  <title id="ttl">IPAForge concept mockup — review, sign and export</title>
  <desc id="dsc">Concept only, not a screenshot of working software. A proposed review screen with a five-step progress rail, profile and identity selection, pre-flight checks that distinguish pass from not checked, and a disabled export action. All values are sample data.</desc>
