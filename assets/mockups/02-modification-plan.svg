<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img"
     aria-labelledby="ttl dsc" font-family="Inter, -apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title id="ttl">IPAForge concept mockup — modification plan</title>
  <desc id="dsc">Concept only, not a screenshot of working software. A proposed screen listing staged, reversible modifications, with profile-dependent options marked and a validation panel that reports unknowns. Sample data.</desc>
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7BE78"/><stop offset="1" stop-color="#E08A3C"/>
    </linearGradient>
    <clipPath id="win"><rect x="24" y="24" width="1552" height="952" rx="18"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="#06080B"/>
  <rect x="24" y="24" width="1552" height="952" rx="18" fill="#0B0E13" stroke="#222C38"/>

  <g clip-path="url(#win)">
    <rect x="24" y="24" width="1552" height="50" fill="#0D1117"/>
    <circle cx="52" cy="49" r="5" fill="#39434F"/>
    <circle cx="70" cy="49" r="5" fill="#39434F"/>
    <circle cx="88" cy="49" r="5" fill="#39434F"/>
    <text x="120" y="54" font-size="13" fill="#B9C6D4">IPAForge <tspan fill="#68788B">/ Modify</tspan></text>
    <rect x="1244" y="37" width="308" height="24" rx="12" fill="#131A23" stroke="#2A3542"/>
    <text x="1398" y="53" text-anchor="middle" font-size="10" letter-spacing="1.6" fill="#8B9CAF">CONCEPT · NOT A WORKING APP</text>
    <line x1="24" y1="74" x2="1576" y2="74" stroke="#1B242E"/>

    <!-- sidebar -->
    <rect x="24" y="74" width="260" height="902" fill="#0D1218"/>
    <line x1="284" y1="74" x2="284" y2="976" stroke="#1B242E"/>
    <rect x="46" y="98" width="32" height="32" rx="10" fill="url(#amber)"/>
    <rect x="53" y="106" width="18" height="4" rx="2" fill="#3A1E0A"/>
    <rect x="53" y="113" width="18" height="4" rx="2" fill="#3A1E0A" opacity="0.75"/>
    <rect x="53" y="120" width="11" height="4" rx="2" fill="#3A1E0A" opacity="0.5"/>
    <text x="90" y="115" font-size="15" font-weight="600" fill="#E8EEF6">IPAForge</text>
    <text x="90" y="132" font-size="9.5" letter-spacing="1.3" fill="#64748A">PREVIEW CONCEPT</text>

    <g fill="#7E8FA2"><rect x="50" y="179" width="13" height="4" rx="2" opacity="0.7"/><rect x="50" y="186" width="13" height="4" rx="2" opacity="0.45"/></g>
    <text x="72" y="190" font-size="12.5" fill="#8796A8">Library</text>

    <g stroke="#7E8FA2" stroke-width="1.7" fill="none" stroke-linecap="round">
      <circle cx="55" cy="223" r="5"/><line x1="59" y1="227" x2="63" y2="231"/>
    </g>
    <text x="72" y="232" font-size="12.5" fill="#8796A8">Inspect</text>

    <rect x="38" y="250" width="232" height="38" rx="10" fill="#1A232F"/>
    <rect x="37" y="258" width="3" height="22" rx="1.5" fill="url(#amber)"/>
    <g stroke="#F0A14B" stroke-width="1.7" stroke-linecap="round">
      <line x1="47" y1="264" x2="62" y2="264"/><line x1="47" y1="270" x2="62" y2="270"/><line x1="47" y1="276" x2="62" y2="276"/>
    </g>
    <g fill="#1A232F" stroke="#F0A14B" stroke-width="1.7">
      <circle cx="56" cy="264" r="2.4"/><circle cx="51" cy="270" r="2.4"/><circle cx="58" cy="276" r="2.4"/>
    </g>
    <text x="72" y="274" font-size="12.5" fill="#E8EEF6">Modify</text>

    <path d="M55 299 L64 302 V310 C64 317 60 321 55 323 C50 321 46 317 46 310 V302 Z"
          fill="none" stroke="#7E8FA2" stroke-width="1.7" stroke-linejoin="round"/>
    <text x="72" y="316" font-size="12.5" fill="#8796A8">Sign &amp; Export</text>

    <rect x="49" y="345" width="12" height="17" rx="3" fill="none" stroke="#7E8FA2" stroke-width="1.6"/>
    <line x1="53" y1="358" x2="57" y2="358" stroke="#7E8FA2" stroke-width="1.6" stroke-linecap="round"/>
    <text x="72" y="358" font-size="12.5" fill="#8796A8">Devices</text>

    <g stroke="#7E8FA2" stroke-width="1.7" stroke-linecap="round">
      <line x1="48" y1="389" x2="62" y2="389"/><line x1="48" y1="395" x2="62" y2="395"/><line x1="48" y1="401" x2="56" y2="401"/>
    </g>
    <text x="72" y="400" font-size="12.5" fill="#8796A8">Log</text>

    <circle cx="55" cy="437" r="6" fill="none" stroke="#7E8FA2" stroke-width="1.7"/>
    <circle cx="55" cy="437" r="2" fill="#7E8FA2"/>
    <text x="72" y="442" font-size="12.5" fill="#8796A8">Settings</text>

    <rect x="38" y="486" width="232" height="76" rx="10" fill="#101822" stroke="#1E2834"/>
    <circle cx="250" cy="506" r="4" fill="#F0A14B"/>
    <text x="52" y="512" font-size="11" font-weight="600" fill="#B9C6D4">No device connected</text>
    <text x="52" y="530" font-size="9.5" fill="#64748A">detection is not yet tested</text>
    <text x="52" y="546" font-size="9.5" fill="#64748A">on any platform</text>

    <text x="48" y="886" font-size="10" fill="#5A6A7D">v0.0.0 · foundation</text>
    <text x="48" y="902" font-size="10" fill="#4A5A6C">no source vendored yet</text>

    <!-- content -->
    <text x="320" y="130" font-size="26" font-weight="700" fill="#EAF0F7">Modification plan</text>
    <text x="320" y="154" font-size="12.5" fill="#8394A7">Changes are staged here and applied only on export. Profile-dependent options say so before you use them.</text>
    <rect x="980" y="98" width="152" height="34" rx="9" fill="#131B24" stroke="#29343F"/>
    <text x="1056" y="119" text-anchor="middle" font-size="10" letter-spacing="1.4" fill="#8B9CB0">STAGE 3 OF 5</text>

    <!-- card 1: display name -->
    <rect x="320" y="190" width="812" height="82" rx="12" fill="#121A23" stroke="#232D3A"/>
    <rect x="340" y="213" width="26" height="26" rx="7" fill="#1B2530" stroke="#26313D"/>
    <text x="353" y="231" text-anchor="middle" font-size="10" fill="#8B9CB0">Aa</text>
    <text x="382" y="221" font-size="13.5" font-weight="600" fill="#E2EAF3">Display name</text>
    <text x="382" y="241" font-size="11" fill="#7E8FA2">Override the name shown on the home screen.</text>
    <rect x="998" y="208" width="52" height="20" rx="5" fill="#241E12" stroke="#453720"/>
    <text x="1024" y="222" text-anchor="middle" font-size="9" fill="#E7B37A">staged</text>
    <rect x="1074" y="220" width="40" height="22" rx="11" fill="url(#amber)"/>
    <circle cx="1103" cy="231" r="8" fill="#2A1607"/>

    <!-- card 2: bundle identifier -->
    <rect x="320" y="284" width="812" height="82" rx="12" fill="#121A23" stroke="#232D3A"/>
    <rect x="340" y="307" width="26" height="26" rx="7" fill="#1B2530" stroke="#26313D"/>
    <text x="353" y="325" text-anchor="middle" font-size="9" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#8B9CB0">id</text>
    <text x="382" y="315" font-size="13.5" font-weight="600" fill="#E2EAF3">Bundle identifier</text>
    <text x="382" y="335" font-size="11" fill="#7E8FA2">Must stay within the selected provisioning profile.</text>
    <rect x="962" y="302" width="88" height="20" rx="5" fill="#1A222D" stroke="#2C3846"/>
    <text x="1006" y="316" text-anchor="middle" font-size="9" fill="#8B9CB0">profile-bound</text>
    <rect x="1074" y="314" width="40" height="22" rx="11" fill="#202A36" stroke="#2C3846"/>
    <circle cx="1085" cy="325" r="8" fill="#78899C"/>

    <!-- card 3: icon -->
    <rect x="320" y="378" width="812" height="82" rx="12" fill="#121A23" stroke="#232D3A"/>
    <rect x="340" y="401" width="26" height="26" rx="7" fill="#1B2530" stroke="#26313D"/>
    <rect x="347" y="408" width="12" height="12" rx="3" fill="none" stroke="#8B9CB0" stroke-width="1.4"/>
    <text x="382" y="409" font-size="13.5" font-weight="600" fill="#E2EAF3">App icon</text>
    <text x="382" y="429" font-size="11" fill="#7E8FA2">Replace asset-catalog variants; legacy PNG fallback.</text>
    <rect x="998" y="396" width="52" height="20" rx="5" fill="#241E12" stroke="#453720"/>
    <text x="1024" y="410" text-anchor="middle" font-size="9" fill="#E7B37A">staged</text>
    <rect x="1074" y="408" width="40" height="22" rx="11" fill="url(#amber)"/>
    <circle cx="1103" cy="419" r="8" fill="#2A1607"/>

    <!-- card 4: bundled files -->
    <rect x="320" y="472" width="812" height="82" rx="12" fill="#121A23" stroke="#232D3A"/>
    <rect x="340" y="495" width="26" height="26" rx="7" fill="#1B2530" stroke="#26313D"/>
    <g fill="#8B9CB0"><rect x="347" y="503" width="12" height="3" rx="1.5"/><rect x="347" y="509" width="12" height="3" rx="1.5" opacity="0.6"/></g>
    <text x="382" y="503" font-size="13.5" font-weight="600" fill="#E2EAF3">Bundled files</text>
    <text x="382" y="523" font-size="11" fill="#7E8FA2">Add or remove resources you own. Nothing is downloaded.</text>
    <rect x="998" y="490" width="52" height="20" rx="5" fill="#1A222D" stroke="#2C3846"/>
    <text x="1024" y="504" text-anchor="middle" font-size="9" fill="#8B9CB0">staged</text>
    <rect x="1074" y="502" width="40" height="22" rx="11" fill="#202A36" stroke="#2C3846"/>
    <circle cx="1085" cy="513" r="8" fill="#78899C"/>

    <!-- card 5: extensions -->
    <rect x="320" y="566" width="812" height="82" rx="12" fill="#121A23" stroke="#232D3A"/>
    <rect x="340" y="589" width="26" height="26" rx="7" fill="#1B2530" stroke="#26313D"/>
    <rect x="346" y="595" width="11" height="11" rx="2" fill="none" stroke="#8B9CB0" stroke-width="1.4"/>
    <rect x="354" y="603" width="9" height="9" rx="2" fill="#1B2530" stroke="#8B9CB0" stroke-width="1.4"/>
    <text x="382" y="597" font-size="13.5" font-weight="600" fill="#E2EAF3">App extensions</text>
    <text x="382" y="617" font-size="11" fill="#7E8FA2">Strip bundled extensions you do not intend to ship.</text>
    <rect x="990" y="584" width="60" height="20" rx="5" fill="#1A222D" stroke="#2C3846"/>
    <text x="1020" y="598" text-anchor="middle" font-size="9" fill="#8B9CB0">planned</text>
    <rect x="1074" y="596" width="40" height="22" rx="11" fill="#202A36" stroke="#2C3846"/>
    <circle cx="1085" cy="607" r="8" fill="#78899C"/>

    <!-- card 6: injection -->
    <rect x="320" y="660" width="812" height="82" rx="12" fill="#121A23" stroke="#232D3A"/>
    <rect x="340" y="683" width="26" height="26" rx="7" fill="#1B2530" stroke="#26313D"/>
    <path d="M348 696 h8 M353 691 v10" stroke="#8B9CB0" stroke-width="1.4" stroke-linecap="round"/>
    <text x="382" y="691" font-size="13.5" font-weight="600" fill="#E2EAF3">Symbol injection</text>
    <text x="382" y="711" font-size="11" fill="#7E8FA2">Code you compiled and are authorised to sign, only.</text>
    <rect x="958" y="678" width="92" height="20" rx="5" fill="#1A222D" stroke="#2C3846"/>
    <text x="1004" y="692" text-anchor="middle" font-size="9" fill="#8B9CB0">review required</text>
    <rect x="1074" y="690" width="40" height="22" rx="11" fill="#202A36" stroke="#2C3846"/>
    <circle cx="1085" cy="701" r="8" fill="#78899C"/>

    <!-- summary -->
    <rect x="320" y="754" width="812" height="92" rx="12" fill="#121B24" stroke="#26313D"/>
    <text x="348" y="786" font-size="12.5" font-weight="600" fill="#DCE6F0">2 changes staged</text>
    <text x="348" y="806" font-size="10.5" fill="#7E8FA2">Nothing is written until you review and export.</text>
    <rect x="900" y="782" width="96" height="40" rx="10" fill="#131B24" stroke="#29343F"/>
    <text x="948" y="807" text-anchor="middle" font-size="11.5" fill="#BCC9D6">Discard</text>
    <rect x="1008" y="782" width="124" height="40" rx="10" fill="url(#amber)"/>
    <text x="1070" y="807" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2A1607">Review changes</text>

    <!-- validation pane -->
    <rect x="1168" y="74" width="408" height="902" fill="#0C1118"/>
    <line x1="1168" y1="74" x2="1168" y2="976" stroke="#1B242E"/>
    <text x="1192" y="116" font-size="9.5" letter-spacing="2" fill="#6C7D90">VALIDATION</text>
    <text x="1192" y="152" font-size="10.5" fill="#8B9CB0">Provisioning profile</text>
    <rect x="1466" y="140" width="86" height="20" rx="5" fill="#1A222D" stroke="#2C3846"/>
    <text x="1509" y="154" text-anchor="middle" font-size="9" fill="#8B9CB0">not selected</text>
    <text x="1192" y="194" font-size="10.5" fill="#8B9CB0">Bundle ID within profile</text>
    <rect x="1482" y="182" width="70" height="20" rx="5" fill="#1A222D" stroke="#2C3846"/>
    <text x="1517" y="196" text-anchor="middle" font-size="9" fill="#8B9CB0">unknown</text>
    <text x="1192" y="236" font-size="10.5" fill="#8B9CB0">Entitlements ⊆ profile</text>
    <rect x="1482" y="224" width="70" height="20" rx="5" fill="#1A222D" stroke="#2C3846"/>
    <text x="1517" y="238" text-anchor="middle" font-size="9" fill="#8B9CB0">unknown</text>
    <text x="1192" y="278" font-size="10.5" fill="#8B9CB0">Minimum iOS vs profile</text>
    <rect x="1482" y="266" width="70" height="20" rx="5" fill="#1A222D" stroke="#2C3846"/>
    <text x="1517" y="280" text-anchor="middle" font-size="9" fill="#8B9CB0">unknown</text>
    <text x="1192" y="320" font-size="10.5" fill="#8B9CB0">Signing identity</text>
    <rect x="1466" y="308" width="86" height="20" rx="5" fill="#1A222D" stroke="#2C3846"/>
    <text x="1509" y="322" text-anchor="middle" font-size="9" fill="#8B9CB0">not selected</text>

    <rect x="1192" y="364" width="360" height="170" rx="12" fill="#1C1710" stroke="#3A2E1E"/>
    <text x="1216" y="394" font-size="11.5" font-weight="600" fill="#F0C08A">Entitlements are a constraint</text>
    <text x="1216" y="420" font-size="10.5" fill="#A9977F">IPAForge never invents an entitlement.</text>
    <text x="1216" y="438" font-size="10.5" fill="#A9977F">Anything the profile does not grant is shown</text>
    <text x="1216" y="456" font-size="10.5" fill="#A9977F">as dropped, and export fails loudly if a</text>
    <text x="1216" y="474" font-size="10.5" fill="#A9977F">required value would have to change.</text>

    <text x="1192" y="576" font-size="9.5" letter-spacing="2" fill="#6C7D90">CHANGE RISK</text>
    <circle cx="1198" cy="600" r="4" fill="#57C98B"/>
    <text x="1212" y="604" font-size="10.5" fill="#8B9CB0">Cosmetic</text>
    <text x="1552" y="604" text-anchor="end" font-size="10.5" fill="#CFDAE6">2</text>
    <circle cx="1198" cy="628" r="4" fill="#F0A14B"/>
    <text x="1212" y="632" font-size="10.5" fill="#8B9CB0">Structural</text>
    <text x="1552" y="632" text-anchor="end" font-size="10.5" fill="#CFDAE6">0</text>
    <circle cx="1198" cy="656" r="4" fill="#F2685F"/>
    <text x="1212" y="660" font-size="10.5" fill="#8B9CB0">Sensitive</text>
    <text x="1552" y="660" text-anchor="end" font-size="10.5" fill="#CFDAE6">0</text>

    <text x="1192" y="944" font-size="9.5" fill="#4A5A6C">Mockup only · no modification engine exists</text>

    <line x1="24" y1="920" x2="1576" y2="920" stroke="#1A232E"/>
    <text x="302" y="950" font-size="10" letter-spacing="1.2" fill="#5F7084">STAGED · NOTHING WRITTEN</text>
    <text x="1552" y="950" text-anchor="end" font-size="10" fill="#4E5E71">Concept render · sample data · not a working build</text>
  </g>
</svg>
